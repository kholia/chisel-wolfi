name: Security

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vulnerabilities:
    name: Source and binary vulnerability checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check vulnerable imports and symbols, including tests
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -test ./...

      - name: Build release binary
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p "${RUNNER_TEMP}/chisel-bin"
          go build -trimpath -o "${RUNNER_TEMP}/chisel-bin/chisel" ./cmd/chisel

      - name: Check binary for vulnerable symbols
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "${RUNNER_TEMP}/chisel-bin/chisel"

      - name: Scan dependencies and CI actions
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: .
          output-format: table
          severity-cutoff: low

      - name: Scan compiled binary and Go standard library
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          path: ${{ runner.temp }}/chisel-bin
          output-format: table
          severity-cutoff: low
