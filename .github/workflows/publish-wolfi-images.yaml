name: Publish Wolfi Images

on:
  workflow_dispatch:
    inputs:
      tag_date:
        description: "Date portion of the immutable tag in YYYY-MM-DD format. Leave empty to use today's UTC date."
        required: false
        type: string
      tag_revision:
        description: "Increment for this date. Produces tags like YYYY-MM-DD_1."
        required: true
        default: "1"
        type: string
      image_set:
        description: "Which examples to publish."
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - popular
          - all
      platforms:
        description: "Buildx platforms. Public Wolfi currently supports these for this repo's examples."
        required: true
        default: linux/amd64,linux/arm64
        type: string

permissions:
  contents: read
  packages: write

env:
  DOCKER_BUILDKIT: "1"
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare Tags
    runs-on: ubuntu-22.04
    outputs:
      date_tag: ${{ steps.meta.outputs.date_tag }}
      images: ${{ steps.meta.outputs.images }}
    steps:
      - name: Select images and tag
        id: meta
        env:
          INPUT_DATE: ${{ inputs.tag_date }}
          INPUT_REVISION: ${{ inputs.tag_revision }}
          IMAGE_SET: ${{ inputs.image_set }}
        run: |
          set -euo pipefail

          tag_date="$INPUT_DATE"
          if [ -z "$tag_date" ]; then
            tag_date="$(date -u +%F)"
          fi

          if ! [[ "$tag_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "tag_date must use YYYY-MM-DD format" >&2
            exit 1
          fi

          case "$INPUT_REVISION" in
            ''|*[!0-9]*) echo "tag_revision must be a positive integer" >&2; exit 1 ;;
            0) echo "tag_revision must be greater than zero" >&2; exit 1 ;;
          esac

          case "$IMAGE_SET" in
            smoke)
              images='["wolfi-curl","wolfi-wget","wolfi-vault","wolfi-envoy","wolfi-prometheus","wolfi-nginx"]'
              ;;
            popular)
              images='["wolfi-curl","wolfi-wget","wolfi-stunnel","wolfi-unbound","wolfi-network-tools","wolfi-envoy","wolfi-fluent-bit","wolfi-prometheus","wolfi-grafana","wolfi-alertmanager","wolfi-otel-collector","wolfi-nginx","wolfi-opa","wolfi-valkey","wolfi-vault","wolfi-aws-cli","wolfi-terraform"]'
              ;;
            all)
              images='["wolfi-dockerfile","wolfi-curl","wolfi-wget","wolfi-stunnel","wolfi-unbound","wolfi-network-tools","wolfi-envoy","wolfi-fluent-bit","wolfi-prometheus","wolfi-grafana","wolfi-alertmanager","wolfi-thanos","wolfi-otel-collector","wolfi-kube-state-metrics","wolfi-kube-rbac-proxy","wolfi-grafana-alloy","wolfi-opa","wolfi-opa-envoy","wolfi-gatekeeper","wolfi-nginx","wolfi-valkey","wolfi-memcached","wolfi-postgres","wolfi-kafka","wolfi-nats-server","wolfi-coredns","wolfi-vault","wolfi-aws-cli","wolfi-terraform","wolfi-go-build","wolfi-go-runtime","wolfi-node-build","wolfi-node-runtime","wolfi-java-build","wolfi-java-runtime"]'
              ;;
            *) echo "unsupported image_set: $IMAGE_SET" >&2; exit 1 ;;
          esac

          echo "date_tag=${tag_date}_${INPUT_REVISION}" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.example }}
    runs-on: ubuntu-22.04
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        example: ${{ fromJSON(needs.prepare.outputs.images) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and test native image
        env:
          EXAMPLE: ${{ matrix.example }}
        run: |
          set -euo pipefail
          make -C "examples/$EXAMPLE" IMAGE="chisel-wolfi:${EXAMPLE}-publish-test" build test size

      - name: Publish multi-platform image
        env:
          DATE_TAG: ${{ needs.prepare.outputs.date_tag }}
          EXAMPLE: ${{ matrix.example }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail

          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          image_name="${EXAMPLE#wolfi-}"
          image_ref="$REGISTRY/$owner/chisel-wolfi-$image_name"
          mapfile -t wolfi_build_args < <(make -s -f examples/wolfi-versions.mk print-build-args)

          docker buildx build \
            --platform "$PLATFORMS" \
            "${wolfi_build_args[@]}" \
            --file "examples/$EXAMPLE/Dockerfile" \
            --tag "$image_ref:$DATE_TAG" \
            --provenance=false \
            --sbom=false \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$DATE_TAG" \
            --push \
            .

          inspect_output="$(docker buildx imagetools inspect "$image_ref:$DATE_TAG")"
          printf '%s\n' "$inspect_output"

          if printf '%s\n' "$inspect_output" | grep -q 'unknown/unknown'; then
            echo "$image_ref:$DATE_TAG contains an unknown/unknown manifest, usually from Buildx attestations" >&2
            exit 1
          fi

          for platform in ${PLATFORMS//,/ }; do
            if ! printf '%s\n' "$inspect_output" | grep -Eq "Platform:[[:space:]]+$platform([[:space:]]|$)"; then
              echo "$image_ref:$DATE_TAG is missing platform $platform" >&2
              exit 1
            fi
          done

          printf 'Published %s with immutable tag %s\n' "$image_ref" "$DATE_TAG"
