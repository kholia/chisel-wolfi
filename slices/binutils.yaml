package: binutils

slices:
  dev:
    essential:
      glibc_runtime:
      zlib_libs:
    contents:
      /usr/aarch64-unknown-linux-gnu/**: {arch: aarch64}
      /usr/x86_64-pc-linux-gnu/**: {arch: x86_64}
      /usr/bin/addr2line:
      /usr/bin/ar:
      /usr/bin/as:
      /usr/bin/c++filt:
      /usr/bin/dwp:
      /usr/bin/elfedit:
      /usr/bin/gprof:
      /usr/bin/ld:
      /usr/bin/ld.bfd:
      /usr/bin/nm:
      /usr/bin/objcopy:
      /usr/bin/objdump:
      /usr/bin/ranlib:
      /usr/bin/readelf:
      /usr/bin/size:
      /usr/bin/strings:
      /usr/bin/strip:
      /usr/lib/bfd-plugins/**:
      /var/lib/db/sbom/binutils-*.spdx.json:
